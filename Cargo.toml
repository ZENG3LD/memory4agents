[package]
name = "memory4agent"
version = "0.2.10"
edition = "2021"
description = "Code-intelligence and memory infrastructure for coding agents: AST index, dependency graph, and fuzzy search server"
license = "MIT"
repository = "https://github.com/ZENG3LD/dig2memory"

[workspace]

[features]
default = ["lang-rust"]
lang-rust = []
lang-typescript = ["dep:tree-sitter-typescript"]
lang-python = ["dep:tree-sitter-python"]
lang-go = ["dep:tree-sitter-go"]
watcher = ["dep:notify"]

[[bin]]
name = "memory4agent-server"
path = "src/bin/server.rs"

[[bin]]
name = "memory4agent"
path = "src/bin/cli.rs"

[dependencies]
# Core / AST
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
cargo_metadata = "0.19"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
thiserror = "2"
tracing = "0.1"
notify = { version = "6", optional = true }

# Server
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# d-watchdog registry client: `router::DocRouter` builds the route table and
# records its own endpoint list; `register::spawn` pushes that list as this
# service's self-asserted manifest (see `src/server/registration.rs`).
nemo-service = { path = "../nemo-service", default-features = false, features = ["axum", "client"] }

# CLI
clap = { version = "4", features = ["derive"] }
